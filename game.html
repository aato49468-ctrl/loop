<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop - Многоязычное обучение</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: Arial, sans-serif;}
/* Прелоадер */
#preloader {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: linear-gradient(#87CEFA, #ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    flex-direction: column;
    color:#fff;
    font-size:2em;
}
#loader-circle {
    border: 8px solid rgba(255,255,255,0.3);
    border-top: 8px solid #43e97b;
    border-radius:50%;
    width:80px;
    height:80px;
    animation: spin 1.5s linear infinite;
    margin-bottom:20px;
}
@keyframes spin {
    0% {transform:rotate(0deg);}
    100% {transform:rotate(360deg);}
}
/* Снежинки */
.snowflake {
    position: absolute;
    top: -10px;
    color: #fff;
    font-size: 1em;
    user-select: none;
    pointer-events: none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}
@keyframes fall {0% { transform: translateY(0) }100% { transform: translateY(100vh) }}
/* Ёлка */
.tree {position: absolute;bottom: 0;left: 50%;transform: translateX(-50%);width: 0;height: 0;border-left: 50px solid transparent;border-right: 50px solid transparent;border-bottom: 100px solid #0a5e1b;}
.tree:before {content: '';position: absolute;bottom: 40px;left: -40px;width: 0;height: 0;border-left: 40px solid transparent;border-right: 40px solid transparent;border-bottom: 80px solid #0a5e1b;}
.tree:after {content: '';position: absolute;bottom: 80px;left: -30px;width: 0;height: 0;border-left: 30px solid transparent;border-right: 30px solid transparent;border-bottom: 60px solid #0a5e1b;}
.tree-trunk {position: absolute;bottom: -20px;left: 50%;transform: translateX(-50%);width: 20px;height: 20px;background: #8B4513;}
body {background: linear-gradient(#87CEFA, #ffffff);overflow-x:hidden;color:white;position: relative;}
header { background: rgba(0,0,0,0.5); padding:25px 0; text-align:center; box-shadow:0 4px 6px rgba(0,0,0,0.5);}
header h1 { margin:0; font-size:2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.7);}
.container { max-width:900px; margin:30px auto; display:flex; flex-direction:column; gap:25px; padding:0 15px; z-index:2; position:relative;}
.card { background: rgba(0,0,0,0.6); border-radius:15px; padding:25px; box-shadow:0 8px 20px rgba(0,0,0,0.5);}
h2 { text-align:center; margin-bottom:20px; color:#fff;}
input[type=text], input[type=password], select { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc; font-size:16px;}
button { padding:12px 20px; border:none; border-radius:8px; background:#43e97b; color:white; cursor:pointer; font-size:16px; transition: all 0.3s ease; width:100%; margin-bottom:10px;}
button:hover { transform: translateY(-2px); box-shadow:0 6px 15px rgba(0,0,0,0.3);}
.list-item { display:flex; justify-content:space-between; margin-bottom:10px; padding:8px 12px; border-radius:8px; background: rgba(255,255,255,0.2); font-weight:500;}
.options button { width:100%; margin:5px 0; }
.score-life { display:flex; justify-content:space-between; margin-bottom:15px; font-size:18px; }
.word-card { text-align:center; font-size:28px; padding:20px; margin-bottom:15px; border:2px solid #43e97b; border-radius:10px; background:#e8f5e9; color:#000;}
#feedback { text-align:center; font-size:18px; margin-top:10px; }
footer { text-align:center; margin:40px 0; color:#fff; text-shadow:1px 1px 2px rgba(0,0,0,0.7);}
</style>
</head>
<body>

<div id="preloader">
    <div id="loader-circle"></div>
    <div>Loop</div>
</div>

<header>
    <h1>Loop - Многоязычное обучение</h1>
</header>

<div class="container">

    <!-- Выбор языка -->
    <div class="card" id="languageSelectDiv">
        <h2>Выберите язык для изучения</h2>
        <select id="languageSelect" onchange="loadLanguage()">
            <option value="english">Английский</option>
            <option value="spanish">Испанский</option>
            <option value="french">Французский</option>
        </select>
        <button onclick="userLogin()">Продолжить</button>
    </div>

    <!-- Контент пользователя -->
    <div class="card" id="userContent" style="display:none;"></div>
    <div id="feedback"></div>

    <!-- Админский вход -->
    <div class="card" id="adminLoginDiv">
        <h2>Вход администратора</h2>
        <input type="text" id="adminUser" placeholder="Логин">
        <input type="password" id="adminPass" placeholder="Пароль">
        <button onclick="adminLogin()">Войти</button>
        <p id="loginMsg" style="color:red;"></p>
    </div>

    <!-- Админский дашборд -->
    <div class="card" id="dashboardDiv" style="display:none;">
        <h2>Добро пожаловать, Admin!</h2>
        <div class="section">
            <h3>Управление уроками</h3>
            <div id="lessonList"></div>
            <input type="text" id="newLesson" placeholder="Название нового урока">
            <button onclick="addLesson()">Добавить урок</button>
        </div>
        <div class="section">
            <h3>Пользователи</h3>
            <div id="userList"></div>
        </div>
        <button onclick="logout()">Выйти</button>
    </div>

</div>

<div class="tree"></div>
<div class="tree-trunk"></div>

<footer>
    <p>© 2025 Loop</p>
</footer>

<script>
// Прелоадер
window.addEventListener("load", function(){
    setTimeout(()=>{document.getElementById('preloader').style.display='none';},1000);
});

// Снежинки
const snowCount = 50;
for(let i=0;i<snowCount;i++){
    const snow = document.createElement('div');
    snow.classList.add('snowflake');
    snow.innerText = '❄';
    snow.style.left = Math.random() * window.innerWidth + 'px';
    snow.style.fontSize = (Math.random()*20+10) + 'px';
    snow.style.animationDuration = (Math.random()*5+5)+'s';
    document.body.appendChild(snow);
}

// Данные
let adminLoginName = "admin";
let adminPassword = "12345";
let users = [{name:"User1", progress:20},{name:"User2", progress:50}];
let languages = {english:[], spanish:[], french:[]};
for(let i=1;i<=100;i++){
    languages.english.push({title:`Урок ${i}`, words:[{en:`Word${i}A`, ru:`Слово${i}A`},{en:`Word${i}B`, ru:`Слово${i}B`},{en:`Word${i}C`, ru:`Слово${i}C`}]});
    languages.spanish.push({title:`Lección ${i}`, words:[{es:`Palabra${i}A`, ru:`Слово${i}A`},{es:`Palabra${i}B`, ru:`Слово${i}B`},{es:`Palabra${i}C`, ru:`Слово${i}C`}]});
    languages.french.push({title:`Leçon ${i}`, words:[{fr:`Mot${i}A`, ru:`Слово${i}A`},{fr:`Mot${i}B`, ru:`Слово${i}B`},{fr:`Mot${i}C`, ru:`Слово${i}C`}]});
}

// Пользователь
let currentLang = 'english';
let currentLessonIndex = 0;
let currentWordIndex = 0;
let score = 0;
let lives = 3;

function loadLanguage(){ currentLang = document.getElementById("languageSelect").value; }
function userLogin(){
    document.getElementById("languageSelectDiv").style.display="none";
    document.getElementById("adminLoginDiv").style.display="none";
    document.getElementById("userContent").style.display="block";
    showLessons();
}

function showLessons(){
    let html = "<h2>Выберите урок</h2>";
    languages[currentLang].forEach((lesson,index)=>{
        html += `<button onclick="startLesson(${index})">${lesson.title}</button><br>`;
    });
    document.getElementById("userContent").innerHTML = html;
    document.getElementById("feedback").innerText = "";
}

function startLesson(index){
    currentLessonIndex = index; currentWordIndex = 0; score = 0; lives = 3;
    showWord();
}

function shuffleOptions(correct){
    let options = [correct];
    while(options.length<3){
        let wordsArr = Object.values(languages[currentLang][currentLessonIndex].words[Math.floor(Math.random()*3)]);
        let rand = wordsArr[0];
        if(!options.includes(rand)) options.push(rand);
    }
    return options.sort(()=>Math.random()-0.5);
}

function showWord(){
    if(currentWordIndex>=languages[currentLang][currentLessonIndex].words.length){
        document.getElementById("userContent").innerHTML = `<h2>Урок завершен!</h2><p>Очки: ${score}</p><button onclick="showLessons()">Назад к урокам</button>`;
        document.getElementById("feedback").innerText = "";
        return;
    }
    let wordObj = languages[currentLang][currentLessonIndex].words[currentWordIndex];
    let wordKey = Object.keys(wordObj).find(k=>k!=='ru');
    let word = wordObj[wordKey];
    let html = `<div class="score-life"><div>Очки: ${score}</div><div>Жизни: ${lives}</div></div>`;
    html += `<div class="word-card">${word}</div>`;
    let options = shuffleOptions(wordObj.ru);
    html += '<div class="options">';
    options.forEach(opt=>{
        html += `<button onclick="checkAnswer('${opt}')">${opt}</button>`;
    });
    html += '</div>';
    document.getElementById("userContent").innerHTML = html;
    document.getElementById("feedback").innerText = "";
}

function checkAnswer(answer){
    let wordObj = languages[currentLang][currentLessonIndex].words[currentWordIndex];
    let correct = wordObj.ru;
    let feedbackDiv = document.getElementById("feedback");

    if(answer===correct){
        score+=10;
        feedbackDiv.innerText = "Верно!";
        feedbackDiv.style.color = "limegreen";
    } else {
        lives-=1;
        feedbackDiv.innerText = `Неверно! Правильный ответ: ${correct}`;
        feedbackDiv.style.color = "red";
        if(lives<=0){ currentWordIndex = 0; score=0; lives=3; }
    }

    setTimeout(()=>{
        currentWordIndex++;
        showWord();
    },1500);
}

// Админ
function adminLogin(){
    let user = document.getElementById("adminUser").value;
    let pass = document.getElementById("adminPass").value;
    if(user===adminLoginName && pass===adminPassword){
        document.getElementById("dashboardDiv").style.display="block";
        document.getElementById("adminLoginDiv").style.display="none";
        document.getElementById("languageSelectDiv").style.display="none";
        renderLessons();
        renderUsers();
    } else { document.getElementById("loginMsg").innerText = "Неверный логин или пароль!"; }
}

function logout(){
    document.getElementById("dashboardDiv").style.display="none";
    document.getElementById("languageSelectDiv").style.display="block";
    document.getElementById("adminLoginDiv").style.display="block";
}

function renderLessons(){
    let html = "";
    languages[currentLang].forEach((lesson,index)=>{
        html += `<div class="list-item">${lesson.title} <button onclick="deleteLesson(${index})">Удалить</button></div>`;
    });
    document.getElementById("lessonList").innerHTML = html;
}

function addLesson(){
    let lessonName = document.getElementById("newLesson").value;
    if(lessonName){
        languages[currentLang].push({title:lessonName, words:[{en:"NewWordA", ru:"НовоеСловоA"},{en:"NewWordB", ru:"НовоеСловоB"},{en:"NewWordC", ru:"НовоеСловоC"}]});
        document.getElementById("newLesson").value="";
        renderLessons();
    }
}

function deleteLesson(index){
    languages[currentLang].splice(index,1);
    renderLessons();
}

function renderUsers(){
    let html = "";
    users.forEach(user=>{
        html += `<div class="list-item">${user.name} (Прогресс: ${user.progress}%)</div>`;
    });
    document.getElementById("userList").innerHTML = html;
}
</script>

</body>
</html>
